<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400"
     role="img" aria-label="Terminal demo: /skillfed sends abstract wishes for a vendor-invoice task, and the federation returns multiple ranked skill candidates each with license, provenance and star metadata; the agent picks the best and prompts to install into .claude/skills.">
  <title>Skill Federation — /skillfed demo</title>
  <desc>An animated terminal runs /skillfed automate monthly vendor-invoice reconciliation. It shows that only an abstract capability wish crosses the machine boundary, then the federation returns five ranked candidates for the pdf-data-extraction wish — the top one azure-ai-document-intelligence is permissive, verified, 2607 stars and gets selected, while lower matches are review-licensed with few or no stars. A prompt offers to install the selected skills into .claude/skills with license and source attribution.</desc>

  <style>
    .mono { font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    .ink   { fill: #1E1B16; }
    .soft  { fill: #4F493F; }
    .muted { fill: #8A8377; }
    .violet{ fill: #7C5CDB; }
    .green { fill: #2E9E6B; }
    .amber { fill: #C98A12; }

    /* one shared 11s timeline so everything loops in sync */
    .cover { fill: #F7F3EB; transform-box: fill-box; transform-origin: right center;
             animation: wipe 11s linear infinite; }
    @keyframes wipe {
      0%, 4%   { transform: scaleX(1); }
      22%, 96% { transform: scaleX(0); }
      100%     { transform: scaleX(1); }
    }
    .caret { animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 0%,50% { opacity:1 } 50.01%,100% { opacity:0 } }

    .l { opacity: 0; }
    .l1 { animation: r1 11s ease infinite; }
    .l2 { animation: r2 11s ease infinite; }
    .l3 { animation: r3 11s ease infinite; }
    .l4 { animation: r4 11s ease infinite; }
    .l5 { animation: r5 11s ease infinite; }
    .l6 { animation: r6 11s ease infinite; }
    .l7 { animation: r7 11s ease infinite; }
    @keyframes r1 { 0%,25%{opacity:0} 29%,96%{opacity:1} 100%{opacity:0} }
    @keyframes r2 { 0%,31%{opacity:0} 35%,96%{opacity:1} 100%{opacity:0} }
    @keyframes r3 { 0%,37%{opacity:0} 41%,96%{opacity:1} 100%{opacity:0} }
    @keyframes r4 { 0%,43%{opacity:0} 47%,96%{opacity:1} 100%{opacity:0} }
    @keyframes r5 { 0%,49%{opacity:0} 53%,96%{opacity:1} 100%{opacity:0} }
    @keyframes r6 { 0%,55%{opacity:0} 59%,96%{opacity:1} 100%{opacity:0} }
    @keyframes r7 { 0%,62%{opacity:0} 66%,96%{opacity:1} 100%{opacity:0} }
  </style>

  <!-- card -->
  <rect x="6" y="6" width="708" height="388" rx="18" fill="#F7F3EB"
        stroke="#1E1B16" stroke-opacity="0.14"/>
  <!-- title bar -->
  <circle cx="34" cy="36" r="6" fill="#E07A55"/>
  <circle cx="54" cy="36" r="6" fill="#E8C24A"/>
  <circle cx="74" cy="36" r="6" fill="#5FB68C"/>
  <text x="360" y="40" text-anchor="middle" class="mono muted" font-size="12">skill-federation · finder</text>
  <line x1="6" y1="58" x2="714" y2="58" stroke="#1E1B16" stroke-opacity="0.10"/>

  <!-- command line -->
  <text x="30" y="92" class="mono muted" font-size="15">You:</text>
  <text x="78" y="92" class="mono ink" font-size="15">/skillfed automate monthly vendor-invoice reconciliation</text>
  <rect class="cover" x="76" y="78" width="540" height="20"/>
  <rect class="caret" x="618" y="79" width="9" height="17" fill="#7C5CDB"/>

  <!-- boundary beat: only the abstract wish crosses -->
  <g class="l l1">
    <text x="30" y="124" class="mono muted" font-size="12">→ only the abstract wish crosses the boundary — capability vocab, not your task:</text>
    <text x="44" y="144" class="mono violet" font-size="12" xml:space="preserve">"pdf-data-extraction · line items · OCR · table detection · invoice · vendor · tax"</text>
  </g>

  <!-- wish + multiple ranked candidates with real trust metadata -->
  <text class="mono l l2" x="30" y="178" font-size="13"><tspan class="muted">wish: </tspan><tspan class="ink">pdf-data-extraction</tspan><tspan class="muted">  — 5 ranked matches:</tspan></text>

  <!-- candidate 1 (selected) — real top match from the live federation -->
  <g class="l l3">
    <rect x="24" y="189" width="672" height="24" rx="6" fill="#7C5CDB" fill-opacity="0.09"/>
    <text x="36" y="206" class="mono muted" font-size="12">1</text>
    <text x="56" y="206" class="mono ink" font-size="12">azure-ai-document-intelligence-dotnet</text>
    <text x="360" y="206" class="mono" font-size="12"><tspan class="green">permissive</tspan><tspan class="muted"> · verified · </tspan><tspan class="amber">2607★</tspan></text>
    <text x="598" y="206" class="mono violet" font-size="12">✓ picked</text>
  </g>
  <!-- candidate 2 — second strong permissive match -->
  <g class="l l4">
    <text x="36" y="233" class="mono muted" font-size="12">2</text>
    <text x="56" y="233" class="mono ink" font-size="12">azure-ai-document-intelligence-ts</text>
    <text x="360" y="233" class="mono" font-size="12"><tspan class="green">permissive</tspan><tspan class="muted"> · verified · </tspan><tspan class="amber">2607★</tspan></text>
  </g>
  <!-- candidates 3-5 — the honest tail: review-licensed, low-star -->
  <g class="l l5">
    <text x="36" y="260" class="mono muted" font-size="12">+ 3 more · review-licensed · ≤ 6★</text>
  </g>

  <!-- the other two wishes, condensed -->
  <text class="mono l l6" x="30" y="288" font-size="13"><tspan class="muted">+ data-cleaning </tspan><tspan class="ink">→ data-cleanup</tspan><tspan class="muted">,  chat-notification </tspan><tspan class="ink">→ slack-notifier</tspan></text>

  <!-- install prompt -->
  <g class="l l7">
    <text x="30" y="328" class="mono" font-size="13"><tspan class="violet">✦ </tspan><tspan class="soft">Install the selected? → </tspan><tspan class="ink">.claude/skills/</tspan><tspan class="soft"> with license + source.</tspan></text>
    <rect x="30" y="344" width="96" height="30" rx="15" fill="#7C5CDB"/>
    <text x="78" y="364" text-anchor="middle" class="mono" font-size="13" fill="#FFFFFF">Install</text>
    <rect x="136" y="344" width="112" height="30" rx="15" fill="none" stroke="#1E1B16" stroke-opacity="0.25"/>
    <text x="192" y="364" text-anchor="middle" class="mono soft" font-size="13">Review each</text>
  </g>
</svg>
