<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400"
     role="img" aria-label="Terminal demo: /skillfed plans a launch for an open-source dev tool by sending four abstract wishes; the federation returns ranked matches and the agent reads multi-platform-launch, github-presence, community-building and product-analytics in context, each shown with license, provenance and star metadata, then offers to install only the one you will reuse into .claude/skills.">
  <title>Skill Federation — /skillfed demo</title>
  <desc>An animated terminal runs /skillfed plan a launch for my open-source dev tool. Only four abstract capability wishes cross the boundary. The federation returns ranked matches and the agent reads one skill per wish in context as field notes — multi-platform-launch, github-presence and community-building (review-licensed, verified) and product-analytics (permissive, verified, 221 stars) — each picked from ten ranked candidates. All four are read without anything being written to disk; a prompt then offers to install just the one skill you will reuse into .claude/skills, with license and source attribution.</desc>

  <style>
    .mono { font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    .ink   { fill: #1E1B16; }
    .soft  { fill: #4F493F; }
    .muted { fill: #8A8377; }
    .violet{ fill: #7C5CDB; }
    .green { fill: #2E9E6B; }
    .amber { fill: #C98A12; }

    /* one shared 11s timeline so everything loops in sync */
    .cover { fill: #F7F3EB; transform-box: fill-box; transform-origin: right center;
             animation: wipe 11s linear infinite; }
    @keyframes wipe {
      0%, 4%   { transform: scaleX(1); }
      22%, 96% { transform: scaleX(0); }
      100%     { transform: scaleX(1); }
    }
    .caret { animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 0%,50% { opacity:1 } 50.01%,100% { opacity:0 } }

    .l { opacity: 0; }
    .l1 { animation: r1 11s ease infinite; }
    .l2 { animation: r2 11s ease infinite; }
    .l3 { animation: r3 11s ease infinite; }
    .l4 { animation: r4 11s ease infinite; }
    .l5 { animation: r5 11s ease infinite; }
    .l6 { animation: r6 11s ease infinite; }
    .l7 { animation: r7 11s ease infinite; }
    @keyframes r1 { 0%,25%{opacity:0} 29%,96%{opacity:1} 100%{opacity:0} }
    @keyframes r2 { 0%,31%{opacity:0} 35%,96%{opacity:1} 100%{opacity:0} }
    @keyframes r3 { 0%,37%{opacity:0} 41%,96%{opacity:1} 100%{opacity:0} }
    @keyframes r4 { 0%,43%{opacity:0} 47%,96%{opacity:1} 100%{opacity:0} }
    @keyframes r5 { 0%,49%{opacity:0} 53%,96%{opacity:1} 100%{opacity:0} }
    @keyframes r6 { 0%,56%{opacity:0} 60%,96%{opacity:1} 100%{opacity:0} }
    @keyframes r7 { 0%,63%{opacity:0} 67%,96%{opacity:1} 100%{opacity:0} }
  </style>

  <!-- card -->
  <rect x="6" y="6" width="708" height="388" rx="18" fill="#F7F3EB"
        stroke="#1E1B16" stroke-opacity="0.14"/>
  <!-- title bar -->
  <circle cx="34" cy="36" r="6" fill="#E07A55"/>
  <circle cx="54" cy="36" r="6" fill="#E8C24A"/>
  <circle cx="74" cy="36" r="6" fill="#5FB68C"/>
  <text x="360" y="40" text-anchor="middle" class="mono muted" font-size="12">skill-federation · finder</text>
  <line x1="6" y1="58" x2="714" y2="58" stroke="#1E1B16" stroke-opacity="0.10"/>

  <!-- command line -->
  <text x="30" y="92" class="mono muted" font-size="15">You:</text>
  <text x="78" y="92" class="mono ink" font-size="15">/skillfed plan a launch for my open-source dev tool</text>
  <rect class="cover" x="76" y="78" width="470" height="20"/>
  <rect class="caret" x="548" y="79" width="9" height="17" fill="#7C5CDB"/>

  <!-- boundary beat -->
  <text class="mono l l1 muted" x="30" y="124" font-size="12">→ 4 abstract wishes cross the boundary (paraphrases + capability sketch) — never your plan or files</text>

  <!-- wish → selected skill, one per wish (variety; each picked from several ranked matches) -->
  <g class="l l2">
    <text x="30" y="164" class="mono muted" font-size="13">wish: launch-strategy</text>
    <text x="248" y="164" class="mono" font-size="13"><tspan class="violet">→ </tspan><tspan class="ink">multi-platform-launch</tspan></text>
    <text x="470" y="164" class="mono" font-size="13"><tspan class="soft">review</tspan><tspan class="muted"> · verified</tspan></text>
  </g>
  <g class="l l3">
    <text x="30" y="192" class="mono muted" font-size="13">wish: repo-discoverability</text>
    <text x="248" y="192" class="mono" font-size="13"><tspan class="violet">→ </tspan><tspan class="ink">github-presence</tspan></text>
    <text x="470" y="192" class="mono" font-size="13"><tspan class="soft">review</tspan><tspan class="muted"> · verified</tspan></text>
  </g>
  <g class="l l4">
    <text x="30" y="220" class="mono muted" font-size="13">wish: community-building</text>
    <text x="248" y="220" class="mono" font-size="13"><tspan class="violet">→ </tspan><tspan class="ink">community-building</tspan></text>
    <text x="470" y="220" class="mono" font-size="13"><tspan class="soft">review</tspan><tspan class="muted"> · verified</tspan></text>
  </g>
  <g class="l l5">
    <text x="30" y="248" class="mono muted" font-size="13">wish: growth-analytics</text>
    <text x="248" y="248" class="mono" font-size="13"><tspan class="violet">→ </tspan><tspan class="ink">product-analytics</tspan></text>
    <text x="470" y="248" class="mono" font-size="13"><tspan class="green">permissive</tspan><tspan class="muted"> · verified · </tspan><tspan class="amber">221★</tspan></text>
  </g>

  <!-- honesty note: each pick came from a ranked list -->
  <text class="mono l l6 muted" x="30" y="278" font-size="12">each picked from 10 ranked candidates — license · provenance · stars shown for every one</text>

  <!-- read is the default; install is the exception -->
  <g class="l l7">
    <text x="30" y="322" class="mono" font-size="13"><tspan class="violet">✦ </tspan><tspan class="soft">Read all 4 in context — nothing hits disk. Install only what you'll reuse:</tspan></text>
    <rect x="30" y="338" width="96" height="30" rx="15" fill="#7C5CDB"/>
    <text x="78" y="358" text-anchor="middle" class="mono" font-size="13" fill="#FFFFFF">Read 4</text>
    <rect x="136" y="338" width="110" height="30" rx="15" fill="none" stroke="#1E1B16" stroke-opacity="0.25"/>
    <text x="191" y="358" text-anchor="middle" class="mono soft" font-size="13">Install 1</text>
    <text x="262" y="358" class="mono muted" font-size="12">→ .claude/skills/ with license + source</text>
  </g>
</svg>
