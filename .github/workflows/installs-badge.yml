name: Metrics · Badges

# Recomputes the honest install total (npm + PyPI without mirrors) and the cumulative clone total,
# and publishes both as shields.io endpoint JSON on the orphan `badges` branch. The README renders
# them via https://img.shields.io/endpoint?url=.../badges/<installs|clones>.json
#
# Clones accumulate in clones-ledger.json (date -> count) so the total survives GitHub's 14-day
# traffic window. Kept on a dedicated branch so main history stays clean.
#
# Token note: the clone traffic API often 403s for the built-in GITHUB_TOKEN. Add a repo-scope PAT
# as the `TRAFFIC_TOKEN` secret to guarantee clone updates; without it, the clone badge holds its
# last value (installs still update fine).
#
# Trigger: every 4 hours, or run manually.

on:
  schedule:
    - cron: '17 */4 * * *'   # every 4h at :17 past (00:17, 04:17, … UTC)
  workflow_dispatch:

permissions:
  contents: write            # push regenerated badge JSON to the `badges` branch

concurrency:
  group: metrics-badges
  cancel-in-progress: true

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load existing clone ledger from badges branch
        run: |
          git fetch origin badges || true
          git show origin/badges:clones-ledger.json > "$RUNNER_TEMP/clones-ledger.json" 2>/dev/null \
            || echo '{}' > "$RUNNER_TEMP/clones-ledger.json"

      - name: Compute install + clone totals
        env:
          GH_TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # installs: on hard failure (a channel unreachable) leave the previously published
          # badge in place rather than writing a deflated npm-only total.
          python3 scripts/installs_badge.py --verbose > "$RUNNER_TEMP/installs.json" \
            || rm -f "$RUNNER_TEMP/installs.json"
          # clones: on hard failure with no ledger, leave the previously published badge in place
          python3 scripts/clones_badge.py --ledger "$RUNNER_TEMP/clones-ledger.json" \
            > "$RUNNER_TEMP/clones.json" || rm -f "$RUNNER_TEMP/clones.json"

      - name: Publish to badges branch
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch origin badges
            git checkout -B badges origin/badges
          else
            git checkout --orphan badges
            git rm -rf . >/dev/null 2>&1 || true
          fi
          [ -f "$RUNNER_TEMP/installs.json" ] && cp "$RUNNER_TEMP/installs.json" installs.json || true
          cp "$RUNNER_TEMP/clones-ledger.json" clones-ledger.json
          [ -f "$RUNNER_TEMP/clones.json" ] && cp "$RUNNER_TEMP/clones.json" clones.json || true
          git add installs.json clones.json clones-ledger.json
          if git diff --cached --quiet; then
            echo "no change in totals"; exit 0
          fi
          git commit -m "chore(badges): update install + clone totals"
          git push origin badges
